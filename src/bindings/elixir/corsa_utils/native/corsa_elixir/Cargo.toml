[package]
name = "corsa_elixir"
version = "1.12.3"
edition = "2024"
description = "Rustler NIF for the corsa-bind Elixir binding"
publish = false
documentation.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
corsa_client = { version = "1.12.3", path = "../../../../../core/corsa_client" }
corsa_core = { version = "1.12.3", path = "../../../../../core/corsa_core" }
corsa_lsp = { version = "1.12.3", path = "../../../../../core/corsa_lsp" }
corsa_runtime = { version = "1.12.3", path = "../../../../../core/corsa_runtime" }
lsp-types = "0.97"
rustler = { version = "0.38.0", features = ["nif_version_2_16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
