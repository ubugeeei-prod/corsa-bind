[package]
name = "corsa_node"
version = "0.42.0"
edition = "2024"
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
experimental-distributed = ["corsa/experimental-distributed"]

[dependencies]
lsp-types = "0.97"
napi = { version = "3", default-features = false, features = [
  "napi4",
  "dyn-symbols",
  "serde-json",
] }
napi-derive = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-ident.workspace = true
corsa = { version = "0.42.0", path = "../../rust/corsa", features = ["experimental-distributed"] }

[build-dependencies]
napi-build = "2"
