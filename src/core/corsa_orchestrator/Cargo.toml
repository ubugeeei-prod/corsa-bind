[package]
name = "corsa_orchestrator"
version = "2.0.0-beta.3"
edition = "2024"
description = "Worker pooling, project affinity, and result caching for corsa"
publish = ["crates-io"]
documentation.workspace = true
homepage.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "corsa_orchestrator"
path = "src/lib.rs"

[dependencies]
log = { workspace = true }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
corsa_client = { version = "2.0.0-beta.3", path = "../corsa_client" }
corsa_core = { version = "2.0.0-beta.3", path = "../corsa_core" }
corsa_lsp = { version = "2.0.0-beta.3", path = "../corsa_lsp" }
corsa_runtime = { version = "2.0.0-beta.3", path = "../corsa_runtime" }
