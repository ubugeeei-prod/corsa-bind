[workspace]
members = [
  "src/core/corsa_core",
  "src/core/corsa_jsonrpc",
  "src/core/corsa_client",
  "src/core/corsa_lsp",
  "src/core/corsa_orchestrator",
  "src/core/corsa_runtime",
  "src/core/corsa_ref",
  "src/bindings/c/corsa_ffi",
  "src/bindings/rust/corsa",
  "src/bindings/nodejs/corsa_node",
]
resolver = "2"

[workspace.package]
documentation = "https://github.com/ubugeeei-prod/corsa-bind/tree/main/docs"
homepage = "https://github.com/ubugeeei-prod/corsa-bind"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ubugeeei-prod/corsa-bind"
rust-version = "1.85"

[workspace.dependencies]
bumpalo = { version = "3", features = ["collections"] }
compact_str = { version = "0.9", features = ["serde"] }
log = "0.4"
memchr = "2"
phf = { version = "0.13", features = ["macros"] }
rustc-hash = "2"
smallvec = { version = "1", features = ["serde"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
