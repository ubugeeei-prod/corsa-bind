<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-label="corsa-bind">
  <rect width="1200" height="1200" fill="#fafafa" />
  <rect x="64" y="64" width="1072" height="1072" rx="28" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />

  <!-- mark (centered) -->
  <svg x="500" y="330" width="200" height="200" viewBox="0 0 64 64" fill="none">
    <g stroke="#18181b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 15 H13 V49 H20" />
      <path d="M44 15 H51 V49 H44" />
      <path d="M24 24 L32 32 L24 40" />
      <path d="M33 24 L41 32 L33 40" />
    </g>
  </svg>

  <!-- wordmark -->
  <text x="600" y="650" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="104" font-weight="700" letter-spacing="-2">
    <tspan fill="#18181b">corsa</tspan><tspan fill="#71717a" font-weight="500">-bind</tspan>
  </text>

  <!-- tagline -->
  <text x="600" y="740" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="500" fill="#3f3f46">
    Native Rust &amp; JS bindings for the
  </text>
  <text x="600" y="790" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', ui-sans-serif, system-ui, sans-serif" font-size="36" font-weight="500" fill="#3f3f46">
    Corsa TypeScript checker
  </text>

  <line x1="300" y1="880" x2="900" y2="880" stroke="#e4e4e7" stroke-width="2" />

  <!-- features -->
  <text x="600" y="940" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#71717a" letter-spacing="0.5">
    type-aware Oxlint · stdio API + LSP
  </text>
  <text x="600" y="985" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#71717a" letter-spacing="0.5">
