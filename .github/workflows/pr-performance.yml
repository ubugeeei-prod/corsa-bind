name: PR Performance

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-performance-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BENCH_ITERATIONS: "5"
  BENCH_TIMEOUT_MS: "120000"
  BENCH_WARMUP_ITERATIONS: "1"
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Benchmark ${{ matrix.ref-role }} TypeScript ${{ matrix.typescript.channel }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 90
    continue-on-error: ${{ matrix.ref-role == 'base' }}
    strategy:
      fail-fast: false
      matrix:
        ref-role:
          - base
          - head
        typescript:
          - channel: "6"
            package: "typescript@^6"
          - channel: next
            package: "typescript@next"
    steps:
      - name: Resolve benchmark ref
        id: bench-ref
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.ref-role }}" = "base" ]; then
            {
              echo "name=${{ github.event.pull_request.base.ref }}"
              echo "sha=${{ github.event.pull_request.base.sha }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "name=${{ github.event.pull_request.head.ref }}"
              echo "sha=${{ github.event.pull_request.head.sha }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.bench-ref.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Sync pinned Corsa ref
        run: cargo run -p corsa_ref --target-dir .cache/corsa-ref-target -- sync

      - name: Resolve benchmark compatibility
        id: compat
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ref/corsa-upstream ]; then
            echo "build_corsa_task=build_corsa" >> "$GITHUB_OUTPUT"
            echo "build_oxlint_task=build_corsa_oxlint" >> "$GITHUB_OUTPUT"
          elif [ -d ref/typescript-go ]; then
            ln -s typescript-go ref/corsa-upstream
            echo "build_corsa_task=build_tsgo" >> "$GITHUB_OUTPUT"
            echo "build_oxlint_task=build_typescript_oxlint" >> "$GITHUB_OUTPUT"
          else
            echo "missing upstream checkout" >&2
            exit 1
          fi

      - name: Setup Go for pinned Corsa ref
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ref/corsa-upstream/go.mod
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Build pinned Corsa binary
        run: vp run -w ${{ steps.compat.outputs.build_corsa_task }}

      - name: Normalize benchmark paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.ref-role }}" = "base" ]; then
            if [ -f .cache/tsgo ]; then
              cp .cache/tsgo .cache/corsa
            fi
            ln -sfn typescript_oxlint src/bindings/nodejs/corsa_oxlint
          fi

      - name: Build corsa-oxlint package
        run: vp run -w ${{ steps.compat.outputs.build_oxlint_task }}

      - name: Install benchmark comparison dependencies
        run: vp run -w bench_tooling_setup

      - name: Checkout PR helper scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .cache/pr-benchmark/workflow-scripts
          persist-credentials: false

      - name: Select TypeScript ${{ matrix.typescript.channel }}
        shell: bash
        run: |
          set -euo pipefail
          spec="${{ matrix.typescript.package }}"
          npm install --no-save --package-lock=false --legacy-peer-deps --no-fund --no-audit "$spec" --prefix ref/corsa-upstream
          npm install --no-save --package-lock=false --legacy-peer-deps --no-fund --no-audit "$spec" --prefix bench/cli_compare
          node -p "require('./ref/corsa-upstream/node_modules/typescript/package.json').version"
          node -p "require('./bench/cli_compare/node_modules/typescript/package.json').version"

      - name: Run tooling benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/pr-benchmark
          benchmark_args=()
          if [ "${{ matrix.ref-role }}" = "base" ]; then
            benchmark_args+=(--allow-partial-failures)
          fi
          cargo run --manifest-path .cache/pr-benchmark/workflow-scripts/src/bindings/rust/corsa/Cargo.toml --release -p corsa --bin bench_tooling_compare -- \
            --corsa .cache/corsa \
            "${benchmark_args[@]}" \
            --iterations "$BENCH_ITERATIONS" \
            --warmup-iterations "$BENCH_WARMUP_ITERATIONS" \
            --timeout-ms "$BENCH_TIMEOUT_MS" \
            --json-output ".cache/pr-benchmark/raw-${{ matrix.ref-role }}-ts${{ matrix.typescript.channel }}.json"

      - name: Capture benchmark metadata
        shell: bash
        run: |
          set -euo pipefail
          installed_ts="$(node -p "require('./ref/corsa-upstream/node_modules/typescript/package.json').version")"
          node --strip-types ./.cache/pr-benchmark/workflow-scripts/scripts/pr_benchmark_report.ts capture \
            --input ".cache/pr-benchmark/raw-${{ matrix.ref-role }}-ts${{ matrix.typescript.channel }}.json" \
            --output ".cache/pr-benchmark/report-${{ matrix.ref-role }}-ts${{ matrix.typescript.channel }}.json" \
            --branch-role "${{ matrix.ref-role }}" \
            --ref-name "${{ steps.bench-ref.outputs.name }}" \
            --sha "${{ steps.bench-ref.outputs.sha }}" \
            --typescript-channel "${{ matrix.typescript.channel }}" \
            --typescript-requested "${{ matrix.typescript.package }}" \
            --typescript-version "$installed_ts"

      - name: Upload benchmark report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-performance-${{ matrix.ref-role }}-ts${{ matrix.typescript.channel }}
          path: .cache/pr-benchmark/report-${{ matrix.ref-role }}-ts${{ matrix.typescript.channel }}.json
          if-no-files-found: error

  comment:
    name: Comment benchmark result
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: benchmark
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Download benchmark reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .cache/pr-benchmark/results
          pattern: pr-performance-*

      - name: Write benchmark summary
        run: |
          node --strip-types ./scripts/pr_benchmark_report.ts comment \
            --reports-dir .cache/pr-benchmark/results \
            --output .cache/pr-benchmark/comment.md
          cat .cache/pr-benchmark/comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update PR comment
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --strip-types ./scripts/pr_benchmark_report.ts comment \
            --reports-dir .cache/pr-benchmark/results \
            --output .cache/pr-benchmark/comment.md \
            --post-comment
