name: Publish Rust

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type `publish-rust` to continue
        required: true
        type: string
      auth_mode:
        description: Authentication mode for manual runs
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read

concurrency:
  group: publish-rust
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gates:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-rust') && github.ref_type == 'tag' }}
    name: Release Gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount Cargo target sticky disk
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-rust-release-gates-${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          path: target

      - name: Mount corsa_ref target sticky disk
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-rust-release-gates-${{ runner.os }}-corsa-ref-target-${{ hashFiles('Cargo.lock', 'corsa_ref.lock.toml') }}
          path: .cache/corsa-ref-target

      - name: Mount Go build sticky disk
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-rust-release-gates-${{ runner.os }}-go-build-${{ hashFiles('corsa_ref.lock.toml') }}
          path: .cache/go-build

      - name: Mount pnpm store sticky disk
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-rust-release-gates-${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          path: ~/.local/share/pnpm/store

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-targets: false

      - name: Sync pinned Corsa ref
        run: cargo run -p corsa_ref --target-dir .cache/corsa-ref-target -- sync

      - name: Setup Go for pinned Corsa ref
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ref/corsa-upstream/go.mod
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "24"
          cache: ${{ runner.os != 'Linux' }}
          run-install: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --strip-types ./scripts/assert_release_tag.ts

      - name: Check JS and TS
        run: vp check

      - name: Check Rust formatting
        run: vp run -w fmt_check_rust

      - name: Lint Rust
        run: vp run -w lint_rust

      - name: Test
        run: vp run -w test

      - name: Benchmark guards
        run: vp run -w bench_verify

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

      - name: Release dry run
        run: vp run -w release_dry_run

  publish:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-rust') && github.ref_type == 'tag' }}
    name: Publish Rust Crates
    needs:
      - release-gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount Cargo target sticky disk
        uses: useblacksmith/stickydisk@35ba2e331a80056a42af053ee54968511de2b7c7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-rust-publish-${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          path: target

      - name: Setup Node.js for release scripts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-targets: false

      - name: Generate Rust SBOM
        run: node --strip-types ./scripts/generate_sbom.ts --target rust --out .cache/sbom/rust.spdx.json

      - name: Upload Rust SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-sbom
          path: .cache/sbom/rust.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Exchange OIDC token for crates.io token
        if: ${{ github.event_name == 'push' || inputs.auth_mode == 'trusted' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish ordered crates with trusted publishing
        if: ${{ github.event_name == 'push' || inputs.auth_mode == 'trusted' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: node --strip-types ./scripts/publish_rust.ts

      - name: Publish ordered crates with token bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'token' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: node --strip-types ./scripts/publish_rust.ts
