name: Release Dry Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-dry-run:
    name: Release Dry Run
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount Blacksmith sticky caches
        uses: ./.github/actions/blacksmith-sticky-cache
        with:
          suffix: release-dry-run
          corsa-ref-target: "true"
          pnpm-store: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version: "24"
          cache: ${{ runner.os != 'Linux' }}
          run-install: true

      - name: Verify upstream ref
        run: vp run -w verify_ref

      - name: Validate release artifacts
        run: vp run -w release_dry_run
