name: Release Dry Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-dry-run:
    name: Release Dry Run
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Mount Blacksmith sticky caches
        uses: ./.github/actions/blacksmith-sticky-cache
        with:
          suffix: release-dry-run
          corsa-ref-target: "true"
          pnpm-store: "true"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: ${{ runner.os != 'Linux' }}
          run-install: true

      - name: Verify upstream ref
        run: vp run -w verify_ref

      - name: Validate release artifacts
        run: vp run -w release_dry_run
