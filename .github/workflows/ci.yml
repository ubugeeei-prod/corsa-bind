name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  js-format:
    name: JS/TS Format
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check JS and TS formatting
        run: vp fmt --check

  js-lint-types:
    name: JS/TS Lint and Types
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Check JS and TS lint and types
        run: vp check --no-fmt

  rust-format:
    name: Rust Format
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  rust-lint:
    name: Rust Lint
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["blacksmith-32vcpu-ubuntu-2404"]' || '["blacksmith-32vcpu-ubuntu-2404","macos-15","blacksmith-32vcpu-windows-2025"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.2.18"

      - name: Build workspace
        run: vp run -w build_ci

      - name: Check Deno and Bun runtime compatibility
        run: vp run -w check_js_runtime_compat

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["blacksmith-32vcpu-ubuntu-2404"]' || '["blacksmith-32vcpu-ubuntu-2404","macos-15","blacksmith-32vcpu-windows-2025"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: workspace
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Test workspace
        run: vp run -w test

  public-facade:
    name: Public Facade
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build mock Corsa binary
        run: cargo build -p corsa --bin mock_corsa

      - name: Validate public facade without experimental features
        run: cargo test -p corsa --no-default-features --test orchestrator

  non-node-bindings:
    name: Non-Node Bindings
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Go for Go binding
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: src/bindings/go/corsa_utils/go.mod
          cache: false

      - name: Build C ABI and mock server
        run: |
          cargo build -p corsa_ffi
          cargo build -p corsa --bin mock_corsa

      - name: Test Go binding
        working-directory: src/bindings/go/corsa_utils
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
        run: go test ./...

      - name: Compile C++ headers
        shell: bash
        run: |
          mkdir -p .cache/bindings
          cat > .cache/bindings/cpp_smoke.cpp <<'CPP'
          #include "corsa_api.hpp"
          #include "corsa_utils.hpp"
          #include "corsa_virtual_document.hpp"
          int main() {
            auto ref = corsa::utils::to_ref("string");
            return ref.len == 0 ? 1 : 0;
          }
          CPP
          c++ -std=c++20 \
            -I src/bindings/cpp \
            -I src/bindings/c/corsa_ffi/include \
            -c .cache/bindings/cpp_smoke.cpp \
            -o .cache/bindings/cpp_smoke.o

  quality:
    name: Quality
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 5
    needs:
      - js-format
      - js-lint-types
      - rust-format
      - rust-lint
      - build
      - test
      - public-facade
      - non-node-bindings
    if: ${{ always() }}
    steps:
      - name: Verify focused quality checks
        env:
          JS_FORMAT: ${{ needs['js-format'].result }}
          JS_LINT_TYPES: ${{ needs['js-lint-types'].result }}
          RUST_FORMAT: ${{ needs['rust-format'].result }}
          RUST_LINT: ${{ needs['rust-lint'].result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
          PUBLIC_FACADE: ${{ needs['public-facade'].result }}
          NON_NODE_BINDINGS: ${{ needs['non-node-bindings'].result }}
        run: |
          failed=0
          for check in \
            "JS_FORMAT=$JS_FORMAT" \
            "JS_LINT_TYPES=$JS_LINT_TYPES" \
            "RUST_FORMAT=$RUST_FORMAT" \
            "RUST_LINT=$RUST_LINT" \
            "BUILD=$BUILD" \
            "TEST=$TEST" \
            "PUBLIC_FACADE=$PUBLIC_FACADE" \
            "NON_NODE_BINDINGS=$NON_NODE_BINDINGS"; do
            name="${check%%=*}"
            result="${check#*=}"
            echo "$name: $result"
            # main 限定ジョブが PR で skipped になっても落とさないが、
            # ここで集計する 8 ジョブは PR/push 双方で実行されるため success 必須。
            if [ "$result" != "success" ]; then
              failed=1
            fi
          done
          exit "$failed"

  real-corsa-smoke:
    name: Real Corsa Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-32vcpu-ubuntu-2404
          - macos-15
          - blacksmith-32vcpu-windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: corsa-ref
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Sync pinned Corsa ref
        run: cargo run -p corsa_ref --target-dir .cache/corsa-ref-target -- sync

      - name: Setup Go for pinned Corsa ref
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: ref/corsa-upstream/go.mod
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          # Windows can fail inside setup-vp's dependency cache resolver after
          # the managed Corsa upstream checkout has been materialized.
          cache: ${{ runner.os != 'Windows' }}
          run-install: true

      - name: Build pinned Corsa binary
        run: vp run -w build_corsa

      - name: Real Corsa smoke tests
        run: cargo test -p corsa --no-default-features --test real_corsa_regression --test real_corsa_typecheck

      - name: Real examples
        run: vp run -w examples_real

      # Corsa Ref Bench を統合(ubuntu レグのみ): baseline テストとベンチガードを
      # ここで実行し、専用ジョブによる corsa バイナリの二重ビルドを排除する。
      - name: Real Corsa baseline (ubuntu)
        if: ${{ runner.os == 'Linux' }}
        run: cargo test -p corsa --no-default-features --test real_corsa_baseline

      - name: Benchmark guards (ubuntu)
        if: ${{ runner.os == 'Linux' }}
        run: vp run -w bench_verify
