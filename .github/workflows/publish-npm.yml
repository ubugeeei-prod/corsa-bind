name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type `publish-npm` to continue
        required: true
        type: string
      auth_mode:
        description: Authentication mode for manual runs
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token
      tag:
        description: Existing release tag to publish during manual recovery
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NPM_DIST_TAG: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') && 'beta' || '' }}

jobs:
  release-gates:
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-npm' && inputs.tag != '') }}
    name: Release Gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Mount Cargo target sticky disk
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-release-gates-${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          path: target

      - name: Mount corsa_ref target sticky disk
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-release-gates-${{ runner.os }}-corsa-ref-target-${{ hashFiles('Cargo.lock', 'corsa_ref.lock.toml') }}
          path: .cache/corsa-ref-target

      - name: Mount Go build sticky disk
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-release-gates-${{ runner.os }}-go-build-${{ hashFiles('corsa_ref.lock.toml') }}
          path: .cache/go-build

      - name: Mount pnpm store sticky disk
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-release-gates-${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          path: ~/.local/share/pnpm/store

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: false

      - name: Sync pinned Corsa ref
        run: cargo run -p corsa_ref --target-dir .cache/corsa-ref-target -- sync

      - name: Setup Go for pinned Corsa ref
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ref/corsa-upstream/go.mod
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: ${{ runner.os != 'Linux' }}
          run-install: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: node --strip-types ./scripts/assert_release_tag.ts

      - name: Check JS and TS
        run: vp check

      - name: Check Rust formatting
        run: vp run -w fmt_check_rust

      - name: Lint Rust
        run: vp run -w lint_rust

      - name: Test
        run: vp run -w test

      - name: Benchmark guards
        run: vp run -w bench_verify

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

      - name: Release dry run
        run: vp run -w release_dry_run

  resolve-native-targets:
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-npm' && inputs.tag != '') }}
    name: Resolve native binding targets
    needs:
      - release-gates
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Resolve napi build matrix
        id: matrix
        shell: bash
        run: |
          printf 'matrix=%s\n' "$(node --strip-types ./scripts/print_napi_build_matrix.ts)" >> "$GITHUB_OUTPUT"

  build-native-bindings:
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-npm' && inputs.tag != '') }}
    name: Build native binding (${{ matrix.target }})
    needs:
      - release-gates
      - resolve-native-targets
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-native-targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Mount Cargo target sticky disk
        if: ${{ runner.os == 'Linux' }}
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-native-${{ matrix.target }}-${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          path: target

      - name: Mount pnpm store sticky disk
        if: ${{ runner.os == 'Linux' }}
        uses: useblacksmith/stickydisk@e4caf36dbef5c9efe92762742b31167b00005ca7 # v1.4.0
        with:
          key: ${{ github.repository }}-publish-npm-native-${{ matrix.target }}-${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
          path: ~/.local/share/pnpm/store

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-targets: ${{ runner.os != 'Linux' }}

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: ${{ runner.os != 'Linux' }}
          run-install: true

      - name: Setup Zig for musl cross-builds
        if: ${{ contains(matrix.target, 'unknown-linux-musl') || matrix.crossCompile }}
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2

      - name: Build native binding
        shell: bash
        working-directory: src/bindings/nodejs/corsa_node
        run: |
          args=(build --platform --release --target "${{ matrix.target }}")
          cross_arg=""
          case "${{ matrix.target }}" in
            *-unknown-linux-gnu)
              cross_arg="--use-napi-cross"
              ;;
            *-unknown-linux-musl)
              cross_arg="--cross-compile"
              ;;
          esac
          if [[ -z "$cross_arg" && "${{ matrix.useNapiCross || false }}" == "true" ]]; then
            cross_arg="--use-napi-cross"
          fi
          if [[ -z "$cross_arg" && "${{ matrix.crossCompile || false }}" == "true" ]]; then
            cross_arg="--cross-compile"
          fi
          if [[ -n "$cross_arg" ]]; then
            args+=("$cross_arg")
          fi
          ../../../../node_modules/.bin/napi "${args[@]}"

      - name: Generate native SBOM
        run: node --strip-types ./scripts/generate_sbom.ts --target native --native-target "${{ matrix.target }}" --out ".cache/sbom/native-${{ matrix.target }}.spdx.json"

      - name: Upload native binding artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-binding-${{ matrix.target }}
          path: |
            src/bindings/nodejs/corsa_node/*.node
            .cache/sbom/native-${{ matrix.target }}.spdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish-npm' && inputs.tag != '') }}
    name: Publish npm packages
    needs:
      - release-gates
      - build-native-bindings
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Download native binding artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts
          pattern: native-binding-*

      - name: Build publishable npm artifacts
        run: vp run -w build

      - name: Generate npm SBOM
        run: node --strip-types ./scripts/generate_sbom.ts --target npm --out .cache/sbom/npm.spdx.json

      - name: Upload npm and native SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-sboms
          path: |
            .cache/sbom/npm.spdx.json
            artifacts/**/*.spdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish packed tarballs with npm trusted publishing
        if: ${{ github.event_name == 'push' || inputs.auth_mode == 'trusted' }}
        env:
          NAPI_ARTIFACTS_DIR: artifacts
          NAPI_REQUIRE_ALL_TARGETS: "1"
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TRUSTED_PUBLISH: "1"
        run: node --strip-types ./scripts/publish_npm.ts

      - name: Publish packed tarballs with npm token bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'token' }}
        env:
          NAPI_ARTIFACTS_DIR: artifacts
          NAPI_REQUIRE_ALL_TARGETS: "1"
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node --strip-types ./scripts/publish_npm.ts
