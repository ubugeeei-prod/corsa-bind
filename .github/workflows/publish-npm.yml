name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type `publish-npm` to continue
        required: true
        type: string
      auth_mode:
        description: Authentication mode for manual runs
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gates:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-npm') && github.ref_type == 'tag' }}
    name: Release Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Go for pinned tsgo ref
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --strip-types ./scripts/assert_release_tag.ts

      - name: Check JS and TS
        run: vp check

      - name: Check Rust formatting
        run: vp run -w fmt_check_rust

      - name: Lint Rust
        run: vp run -w lint_rust

      - name: Test
        run: vp run -w test

      - name: Benchmark guards
        run: vp run -w bench_verify

      - name: Cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

      - name: Release dry run
        run: vp run -w release_dry_run

  resolve-native-targets:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-npm') && github.ref_type == 'tag' }}
    name: Resolve native binding targets
    needs:
      - release-gates
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Resolve napi build matrix
        id: matrix
        shell: bash
        run: |
          printf 'matrix=%s\n' "$(node --strip-types ./scripts/print_napi_build_matrix.ts)" >> "$GITHUB_OUTPUT"

  build-native-bindings:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-npm') && github.ref_type == 'tag' }}
    name: Build native binding (${{ matrix.target }})
    needs:
      - release-gates
      - resolve-native-targets
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-native-targets.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Setup Zig for cross-built Linux targets
        if: ${{ matrix.useZig }}
        uses: goto-bus-stop/setup-zig@v2

      - name: Build native binding
        shell: bash
        working-directory: src/bindings/nodejs/corsa_node
        run: |
          args=(build --platform --release --target "${{ matrix.target }}")
          if [[ "${{ matrix.useZig }}" == "true" ]]; then
            args+=(--zig)
          fi
          if [[ -n "${{ matrix.zigAbiSuffix }}" ]]; then
            args+=(--zig-abi-suffix "${{ matrix.zigAbiSuffix }}")
          fi
          node ../../../../node_modules/@napi-rs/cli/scripts/index.js "${args[@]}"

      - name: Upload native binding artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-binding-${{ matrix.target }}
          path: src/bindings/nodejs/corsa_node/*.node
          if-no-files-found: error

  publish:
    if: ${{ (github.event_name == 'push' || inputs.confirm == 'publish-npm') && github.ref_type == 'tag' }}
    name: Publish npm packages
    needs:
      - release-gates
      - build-native-bindings
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
          run-install: true

      - name: Download native binding artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
          pattern: native-binding-*

      - name: Build publishable npm artifacts
        run: vp run -w build

      - name: Publish packed tarballs with npm trusted publishing
        if: ${{ github.event_name == 'push' || inputs.auth_mode == 'trusted' }}
        env:
          NAPI_ARTIFACTS_DIR: artifacts
          NAPI_REQUIRE_ALL_TARGETS: "1"
          NPM_CONFIG_PROVENANCE: "true"
          NPM_TRUSTED_PUBLISH: "1"
        run: node --strip-types ./scripts/publish_npm.ts

      - name: Publish packed tarballs with npm token bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.auth_mode == 'token' }}
        env:
          NAPI_ARTIFACTS_DIR: artifacts
          NAPI_REQUIRE_ALL_TARGETS: "1"
          NPM_CONFIG_PROVENANCE: "true"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node --strip-types ./scripts/publish_npm.ts
