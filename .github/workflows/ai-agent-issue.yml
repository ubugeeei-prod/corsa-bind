name: AI Agent Issue Implementation

on:
  issues:
    types:
      - opened
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to implement
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ai-agent-issue-${{ github.event.issue.number || github.event.inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issues' &&
        github.event.action == 'opened'
      )

    steps:
      - name: Validate required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_AGENT_GITHUB_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          missing=0
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is required for openai/codex-action."
            missing=1
          fi

          if [ -z "$AI_AGENT_GITHUB_TOKEN" ]; then
            echo "::error::AI_AGENT_GITHUB_TOKEN is required so PR creation triggers CI workflows."
            missing=1
          fi

          exit "$missing"

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@ca1c46663915d6c1042ae23bd39ab85718bfb0fa # v1
        with:
          node-version: "24"
          run-install: true

      - name: Prefetch Rust dependencies
        run: cargo fetch --locked

      - name: Prepare issue prompt
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            gh issue view "$INPUT_ISSUE_NUMBER" \
              --json number,title,body,url,author,labels,state \
              > "$RUNNER_TEMP/issue.json"
          else
            jq -c '
              .issue
              | {
                  number,
                  title,
                  body,
                  url,
                  author: { login: .user.login },
                  labels: [.labels[].name],
                  state,
                  authorAssociation: .author_association
                }
            ' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue.json"
          fi

          issue_state="$(jq -r '.state' "$RUNNER_TEMP/issue.json")"
          if [ "$issue_state" != "OPEN" ]; then
            echo "::error::Issue must be open."
            exit 1
          fi

          issue_number="$(jq -r '.number' "$RUNNER_TEMP/issue.json")"
          issue_title="$(jq -r '.title' "$RUNNER_TEMP/issue.json")"
          issue_url="$(jq -r '.url' "$RUNNER_TEMP/issue.json")"
          issue_author="$(jq -r '.author.login' "$RUNNER_TEMP/issue.json")"

          jq -r '
            def label_name:
              if type == "string" then . else .name end;

            "# Issue #\(.number): \(.title)\n\n" +
            "URL: \(.url)\n" +
            "Author: @\(.author.login)\n" +
            "Labels: \([.labels[]? | label_name] | join(", "))\n\n" +
            "## Body\n\n" +
            (.body // "")
          ' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue-context.md"

          mkdir -p .codex/ai-agent
          cat > .codex/ai-agent/prompt.md <<'PROMPT'
          You are an AI implementation agent running in GitHub Actions for the corsa-bind repository.

          Implement the issue below in this repository.

          Repository rules:
          - Keep the change narrowly scoped to the issue.
          - Follow the existing style, architecture, and tests in this repository.
          - Do not create commits, branches, tags, or pull requests.
          - Do not include "[codex]" in any title or generated text.
          - The pull request title must use Conventional Commits format, for example "fix: handle missing virtual document".
          - If implementation is unsafe or the issue lacks enough detail, leave the worktree unchanged and explain why in the final message.

          Before finishing:
          - Run focused formatting, linting, or tests when practical.
          - Write a proposed PR title to .codex/ai-agent/pr-title.txt.
          - Write a PR body to .codex/ai-agent/pr-body.md using this repository's pull request template shape.
          - Include the commands you ran under the Validation section.
          - Include "Closes #ISSUE_NUMBER" in the PR body, replacing ISSUE_NUMBER with the actual issue number.

          Issue context:
          PROMPT

          sed "s/#ISSUE_NUMBER/#$issue_number/g" .codex/ai-agent/prompt.md \
            > .codex/ai-agent/prompt.tmp
          mv .codex/ai-agent/prompt.tmp .codex/ai-agent/prompt.md
          cat "$RUNNER_TEMP/issue-context.md" >> .codex/ai-agent/prompt.md

          {
            echo "issue_number=$issue_number"
            echo "issue_url=$issue_url"
            echo "issue_author=$issue_author"
            echo "issue_title<<EOF"
            printf '%s\n' "$issue_title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report start
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_NUMBER" --body "AI Agent started implementing this issue. A pull request will be created if the run produces changes."

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@a26d2d4d8b78a694338b8e3715c3630254340b2c # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .codex/ai-agent/prompt.md
          output-file: .codex/ai-agent/final-message.md
          sandbox: workspace-write
          model: ${{ vars.AI_AGENT_MODEL }}
          effort: medium

      - name: Prepare pull request metadata
        id: pr_meta
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.issue.outputs.issue_title }}
        run: |
          set -euo pipefail

          title_file=".codex/ai-agent/pr-title.txt"
          body_file=".codex/ai-agent/pr-body.md"
          output_body="$RUNNER_TEMP/ai-agent-pr-body.md"

          if [ -s "$title_file" ]; then
            pr_title="$(head -n 1 "$title_file" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          else
            pr_title="chore: address issue #$ISSUE_NUMBER"
          fi

          if printf '%s' "$pr_title" | grep -qi '\[codex\]'; then
            pr_title="chore: address issue #$ISSUE_NUMBER"
          fi

          if ! printf '%s' "$pr_title" \
            | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([A-Za-z0-9._/-]+\))?!?: .+'; then
            pr_title="chore: address issue #$ISSUE_NUMBER"
          fi

          if [ -s "$body_file" ]; then
            cp "$body_file" "$output_body"
          else
            cat > "$output_body" <<BODY
          ## Summary

          - Addresses #$ISSUE_NUMBER with AI Agent generated changes.

          ## Validation

          - [ ] AI Agent did not provide validation details.
          - [ ] CI status is checked by this workflow after PR creation.

          ## Checklist

          - [ ] Scope is limited to the described change
          - [ ] Documentation or templates were updated when needed
          - [ ] Follow-up work is tracked in an issue

          Closes #$ISSUE_NUMBER
          BODY
          fi

          if ! grep -Eq "(Closes|Fixes|Resolves) #$ISSUE_NUMBER" "$output_body"; then
            {
              printf '\n'
              echo "Closes #$ISSUE_NUMBER"
            } >> "$output_body"
          fi

          {
            echo "pr_title<<EOF"
            printf '%s\n' "$pr_title"
            echo "EOF"
            echo "pr_body_file=$output_body"
          } >> "$GITHUB_OUTPUT"

      - name: Detect generated changes
        id: diff
        run: |
          set -euo pipefail

          rm -rf .codex/ai-agent

          if git diff --quiet -- . && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create implementation commit
        if: steps.diff.outputs.has_changes == 'true'
        id: commit
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PR_TITLE: ${{ steps.pr_meta.outputs.pr_title }}
        run: |
          set -euo pipefail

          branch="codex/issue-$ISSUE_NUMBER-$GITHUB_RUN_ID"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -A
          git commit -m "$PR_TITLE"

          {
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Push implementation branch
        if: steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail

          gh auth setup-git
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Create pull request
        if: steps.diff.outputs.has_changes == 'true'
        id: create_pr
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          PR_TITLE: ${{ steps.pr_meta.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.pr_meta.outputs.pr_body_file }}
        run: |
          set -euo pipefail

          pr_url="$(
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY_FILE"
          )"

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "$pr_url"

      - name: Wait for CI
        if: steps.diff.outputs.has_changes == 'true'
        id: wait_for_ci
        env:
          GH_TOKEN: ${{ secrets.AI_AGENT_GITHUB_TOKEN }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
        run: |
          set -euo pipefail

          checks_seen=0
          for _ in $(seq 1 40); do
            if gh pr checks "$PR_URL" --json name,bucket > "$RUNNER_TEMP/pr-checks.json" 2> "$RUNNER_TEMP/pr-checks.err"; then
              if [ "$(jq 'length' "$RUNNER_TEMP/pr-checks.json")" -gt 0 ]; then
                checks_seen=1
                break
              fi
            fi

            sleep 15
          done

          if [ "$checks_seen" -ne 1 ]; then
            echo "::error::No CI checks appeared for $PR_URL. Verify AI_AGENT_GITHUB_TOKEN is not the workflow GITHUB_TOKEN and has permission to trigger workflows."
            exit 1
          fi

          timeout 75m gh pr checks "$PR_URL" --watch --fail-fast --interval 30

      - name: Report no changes
        if: steps.diff.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_NUMBER" --body "AI Agent did not produce a pull request because the worktree had no changes."

      - name: Report pull request result
        if: always() && steps.diff.outputs.has_changes == 'true' && steps.create_pr.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url }}
          CI_OUTCOME: ${{ steps.wait_for_ci.outcome }}
        run: |
          set -euo pipefail

          if [ "$CI_OUTCOME" = "success" ]; then
            body="AI Agent created $PR_URL and CI passed."
          else
            body="AI Agent created $PR_URL, but CI did not pass or did not finish in this workflow. Please inspect the pull request checks."
          fi

          gh issue comment "$ISSUE_NUMBER" --body "$body"
